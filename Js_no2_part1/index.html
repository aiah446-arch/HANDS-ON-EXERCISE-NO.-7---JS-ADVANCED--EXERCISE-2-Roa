<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Javascript 2</title>

    <style>
        body {
            font-family: Arial, Helvetica, sans-serif;
        }
    </style>
</head>

<body>

    <h1>Javascript Web Output #2</h1>

    <table id="tblInput">

        <tr>
            <td width="45%">
                <label for="txtFname">First Name:</label>
            </td>

            <td>
                <input type="text">
            </td>
        </tr>


        <tr>
            <td>
                <label for="">Middle Name:</label>
            </td>

            <td>
                <input type="text">
            </td>
        </tr>


        <tr>
            <td>
                <label for="">Last Name:</label>
            </td>

            <td>
                <input type="text">
            </td>
        </tr>


        <tr>
            <td>
                <label for="">Age:</label>
            </td>

            <td>
                <input type="number">
            </td>
        </tr>


        <tr style="height:20px;">

            <td></td>

            <td style="padding-top: 15px;">

                <button id="btnInsertUpdate" value="insert">
                    Insert
                </button>

                <button id="btnClear">
                    Clear
                </button>

            </td>

        </tr>

    </table>

    <br>


    <fieldset>

        <legend>Records</legend>

        <p id="status" style="color:red; font-size:12px;">
        </p>

        <table id="tblRecords"
               style="border-collapse:collapse; margin:auto;">
        </table>

    </fieldset>


    <button id="btnClearItems" style="margin-top:10px;">
        Clear Records
    </button>


    <span style="margin-left:5px;">
        Sort by:
    </span>


    <!-- SORT BY -->
    <select id="sortField">

        <option value="">
            Please select
        </option>

        <option value="fname">
            First Name
        </option>

        <option value="mname">
            Middle Name
        </option>

        <option value="lname">
            Last Name
        </option>

        <option value="age">
            Age
        </option>

    </select>


    <!-- SORT ORDER -->
    <select id="sortOrder">

        <option value="">
            Please select
        </option>

        <option value="asc">
            A-Z
        </option>

        <option value="desc">
            Z-A
        </option>

    </select>


    <!-- SAVE TO LOCAL STORAGE -->
    <button id="btnSave">
        Save to Local Storage
    </button>


    <script src="script.js"></script>

</body>

</html>
